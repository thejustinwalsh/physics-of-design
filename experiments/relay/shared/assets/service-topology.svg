<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic checkout dependency topology</title>
  <desc id="desc">Checkout API calls pricing API, inventory cache and payments adapter. The diagnostic path is checkout to inventory cache; pool active 64 of 64 and a 1340 millisecond wait.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#6a7887" stroke-width="1.5"/></marker></defs>
  <g fill="none" stroke="#6a7887" stroke-width="2" marker-end="url(#arrow)">
    <path d="M280 160H392V58H488"/><path d="M280 160H488" stroke-width="3"/><path d="M280 160H392V262H488"/>
  </g>
  <g fill="#f3f5f7" stroke="#6a7887" stroke-width="1.5">
    <rect x="44" y="115" width="236" height="90" rx="8"/><rect x="488" y="20" width="258" height="76" rx="8"/>
    <rect x="488" y="122" width="408" height="76" rx="8"/><rect x="488" y="224" width="258" height="76" rx="8"/>
  </g>
  <g fill="#182632" font-family="sans-serif" font-size="20">
    <text x="64" y="150">checkout-api</text><text x="64" y="180" font-size="16">p95 1,850 ms / target 450</text>
    <text x="508" y="50">pricing-api</text><text x="508" y="76" font-size="16">pricing.calculate · 105 ms</text>
    <text x="508" y="152">inventory-cache</text><text x="508" y="178" font-size="16">pool 64/64 · acquire wait 1,340 ms</text>
    <text x="508" y="254">payments-adapter</text><text x="508" y="280" font-size="16">payments.authorize · 120 ms</text>
  </g>
  <text x="44" y="28" fill="#526477" font-family="sans-serif" font-size="14">RELAY / ORIGINAL TECHNICAL DIAGRAM / SYNTHETIC DATA</text>
</svg>

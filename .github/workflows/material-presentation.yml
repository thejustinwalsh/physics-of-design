name: material-presentation
on:
  workflow_dispatch:
  push:
    branches: [diagnose/linux-webkit-presentation]
permissions:
  contents: read
jobs:
  linux-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test test/dom-surface-xwd.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y x11-apps
      - name: Strict uninstrumented control
        id: control
        continue-on-error: true
        env:
          DESIGN_DOM_GPU_OUTPUT: artifacts/material-presentation/control
          DESIGN_DOM_GPU_READBACK_DIAGNOSTIC: '0'
        run: node scripts/prove-dom-surface-gpu.mjs
      - name: Separate instrumented browser run
        id: instrumented
        if: ${{ !cancelled() && steps.control.outcome != 'skipped' }}
        continue-on-error: true
        env:
          DESIGN_DOM_GPU_OUTPUT: artifacts/material-presentation/instrumented
          DESIGN_DOM_GPU_READBACK_DIAGNOSTIC: '1'
        run: node scripts/prove-dom-surface-gpu.mjs
      - name: Separate uninstrumented transform-none fixture
        id: transform_none
        if: ${{ !cancelled() && steps.control.outcome != 'skipped' }}
        continue-on-error: true
        env:
          DESIGN_DOM_GPU_OUTPUT: artifacts/material-presentation/transform-none
          DESIGN_DOM_GPU_READBACK_DIAGNOSTIC: '0'
          DESIGN_DOM_GPU_TRANSFORM_DIAGNOSTIC: none
        run: node scripts/prove-dom-surface-gpu.mjs
      - name: Separate uninstrumented headed control
        id: headed
        if: ${{ !cancelled() && steps.control.outcome != 'skipped' }}
        continue-on-error: true
        env:
          DESIGN_DOM_GPU_OUTPUT: artifacts/material-presentation/headed
          DESIGN_DOM_GPU_READBACK_DIAGNOSTIC: '0'
          DESIGN_DOM_GPU_HEADED_DIAGNOSTIC: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1600x24" node scripts/prove-dom-surface-gpu.mjs
      - name: Separate headed virtual-screen comparison
        id: os_screen
        if: ${{ !cancelled() && steps.control.outcome != 'skipped' }}
        continue-on-error: true
        env:
          DESIGN_DOM_GPU_OUTPUT: artifacts/material-presentation/os-screen
          DESIGN_DOM_GPU_READBACK_DIAGNOSTIC: '0'
          DESIGN_DOM_GPU_HEADED_DIAGNOSTIC: '1'
          DESIGN_DOM_GPU_OS_SCREEN_DIAGNOSTIC: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1600x24" node scripts/prove-dom-surface-gpu.mjs
      - name: Separate unchanged-frame resubmission comparison
        id: repeat_draw
        if: ${{ !cancelled() && steps.control.outcome != 'skipped' }}
        continue-on-error: true
        env:
          DESIGN_DOM_GPU_OUTPUT: artifacts/material-presentation/repeat-draw
          DESIGN_DOM_GPU_READBACK_DIAGNOSTIC: '0'
          DESIGN_DOM_GPU_HEADED_DIAGNOSTIC: '1'
          DESIGN_DOM_GPU_OS_SCREEN_DIAGNOSTIC: '1'
          DESIGN_DOM_GPU_REPEAT_DRAW_DIAGNOSTIC: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1600x24" node scripts/prove-dom-surface-gpu.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-presentation
          path: artifacts/material-presentation
          if-no-files-found: warn
      - name: Preserve strict failure status
        if: ${{ !cancelled() && (steps.control.outcome != 'success' || steps.instrumented.outcome != 'success' || steps.transform_none.outcome != 'success' || steps.headed.outcome != 'success' || steps.os_screen.outcome != 'success' || steps.repeat_draw.outcome != 'success') }}
        run: exit 1

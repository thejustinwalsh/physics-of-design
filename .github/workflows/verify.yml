name: verify
on: [push, pull_request]
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm ci --prefix codemods
      - run: npm ci --prefix experiments/expo-design-theory
      - run: npx playwright install --with-deps chromium webkit --only-shell
      - run: npm run verify
        id: verification
      # Temporary diagnostics: retain every failure rather than retrying it away.
      - name: Fieldwork error diagnostics
        if: always() && (steps.verification.outcome == 'success' || steps.verification.outcome == 'failure')
        run: |
          for iteration in 1 2 3; do
            FIELDWORK_PROOF_DIR="artifacts/fieldwork/proof-web-diagnostic-$iteration" node scripts/prove-fieldwork-web.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            artifacts/verification
            artifacts/dom-surfaces
            artifacts/dom-surfaces-gpu
            artifacts/vela/proof-web/report.json
            artifacts/vela/proof-web/*-bindings.json
            artifacts/fieldwork/proof-web-v2/*.json
            artifacts/fieldwork/proof-web-diagnostic-*/*.json

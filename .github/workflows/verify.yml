name: verify
on: [push, pull_request]
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm ci --prefix codemods
      - run: npm ci --prefix experiments/expo-design-theory
      - run: npm ci --prefix examples/relay/app
      - run: npx playwright install --with-deps chromium webkit --only-shell
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            artifacts/verification
            artifacts/layout-calculus
            artifacts/relay-integration/static-receipt.json
            artifacts/relay-integration/*.log
            artifacts/relay-integration/static
            artifacts/dom-surfaces
            artifacts/dom-surfaces-gpu
            artifacts/vela/proof-web/report.json
            artifacts/vela/proof-web/*-bindings.json
            artifacts/fieldwork/proof-web-v2/*.json
